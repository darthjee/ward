version: '3.8'

services:
  ward_mysql:
    image: mysql:9.3.0
    container_name: ward_mysql
    env_file: .env
    environment:
      MYSQL_DATABASE: ward
      MYSQL_USER: ward
      MYSQL_PASSWORD: ward
      MYSQL_ROOT_PASSWORD: ward
    ports:
      - 0.0.0.0:$WARD_MYSQL_PORT:3306
    volumes:
      - ./docker_volumes/mysql_data:/var/lib/mysql

  # Throwaway database used only by the backend integration suite (`yarn test:integration`).
  # Data lives on tmpfs (no volume, no host port, no env_file), so every start is a clean slate
  # and dev `.env` values cannot leak in.
  ward_mysql_test:
    image: mysql:9.3.0
    container_name: ward_mysql_test
    environment:
      MYSQL_DATABASE: ward_test
      MYSQL_USER: ward
      MYSQL_PASSWORD: ward
      MYSQL_ROOT_PASSWORD: ward
    tmpfs:
      - /var/lib/mysql

  #################### Base (Node build — Express + Yarn) ####################

  base: &base
    image: darthjee/ward   # local tag only — not pushed to Docker Hub
    volumes:
      - ./backend:/home/node/app
    links:
      - ward_mysql:mysql
    env_file: .env

  base_build:
    <<: *base
    build:
      context: .
      dockerfile: dockerfiles/ward/Dockerfile
    command: echo done

  base_prod: &base_prod
    image: darthjee/production_ward
    links:
      - ward_mysql:mysql
    env_file: .env.prod

  base_prod_build:
    <<: *base_prod
    build:
      context: .
      dockerfile: dockerfiles/production_ward/Dockerfile
    command: echo done

  #################### DEV CONTAINERS ####################

  ward_app:
    <<: *base
    container_name: ward_app
    # ./backend is bind-mounted over the image's /home/node/app (see the `base`
    # anchor above), so the image's own dist/ would go stale as soon as source
    # changes — run Nest's watch-mode build against the live-mounted source
    # instead of relying on a one-shot `yarn build && node dist/main.js`.
    command: yarn start:dev
    depends_on:
      - base_build
      - ward_mysql
      - ward_phpmyadmin
    ports:
      - 0.0.0.0:3030:8080
    environment:
      - WARD_MYSQL_PORT=3306

  ward_tests:
    <<: *base
    container_name: ward_tests
    # `links` replaces the list inherited from `base`, so the dev `mysql` link is repeated.
    links:
      - ward_mysql:mysql
      - ward_mysql_test:mysql_test
    depends_on:
      - base_build
      - ward_mysql_test
    # Integration suite connection (also set here so an existing `.env` without them still works).
    environment:
      - WARD_TEST_MYSQL_HOST=mysql_test
      - WARD_TEST_MYSQL_PORT=3306
      - WARD_TEST_MYSQL_USER=ward
      - WARD_TEST_MYSQL_PASSWORD=ward
      - WARD_TEST_MYSQL_NAME=ward_test

  ward_prod_app:
    <<: *base_prod
    container_name: ward_prod_app
    depends_on:
      - base_prod_build
      - ward_mysql
    ports:
      - 0.0.0.0:3030:8080
    environment:
      - WARD_MYSQL_PORT=3306
      - STAGE=production

  ward_fe:
    container_name: ward_fe
    build:
      context: .
      dockerfile: dockerfiles/vite_ward/Dockerfile
    volumes:
      - ./frontend:/home/node/app
      - ./docker_volumes/node_modules:/home/node/app/node_modules
      - ./docker_volumes/static:/home/node/app/dist
    ports:
      - 0.0.0.0:3010:8080
    env_file: .env

  ward_proxy:
    image: darthjee/tent:1.1.0
    container_name: ward_proxy
    env_file: .env
    volumes:
      - ./docker_volumes/static/:/var/www/html/static/
      - ./proxy/dev_configuration:/var/www/html/configuration/
      - ./docker_volumes/proxy_cache:/var/www/html/cache/
      - ./proxy/extension:/var/www/html/extension
    links:
      - ward_app:backend
      - ward_fe:frontend
    depends_on:
      - ward_app
      - ward_fe
    ports:
      - 0.0.0.0:3000:80

  proxy_tests:
    image: darthjee/tent-test:1.1.0
    volumes:
      - ./proxy/extension:/var/www/html/extension
    command: vendor/bin/phpunit --bootstrap /var/www/html/extension/tests/bootstrap.php /var/www/html/extension/tests

  # PSR-12 PHPCS check for proxy/ (ruleset: root phpcs.xml; the same file Codacy reads)
  proxy_lint:
    image: darthjee/tent-test:1.1.0
    volumes:
      - ./phpcs.xml:/repo/phpcs.xml:ro
      - ./proxy:/repo/proxy:ro
    command: vendor/bin/phpcs --standard=/repo/phpcs.xml

  ward_navi:
    image: darthjee/navi-hey:1.6.1
    volumes:
      - ./navi/:/home/node/app
    command: navi-hey --config navi_config.yaml
    environment:
      - WARD_PRODUCTION_URL=$WARD_PRODUCTION_URL
      - NAVI_PORT=3000
      - NAVI_NAMEPACE=$NAVI_NAMEPACE
    ports:
      - 0.0.0.0:3100:3000

  # CircleCI CLI, for validating/processing .circleci/config.yml without installing anything on
  # the host, e.g.:
  #   docker-compose run --rm circleci config validate
  #   docker-compose run --rm circleci config process .circleci/config.yml
  circleci:
    image: circleci/circleci-cli:1.0.50849-alpine
    working_dir: /repo
    volumes:
      - ./.circleci:/repo/.circleci:ro
    entrypoint: circleci

  ward_phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: ward_phpmyadmin
    depends_on: [ward_mysql]
    links:
      - ward_mysql:mysql
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      MYSQL_USER: root
      MYSQL_ROOT_PASSWORD: ward
      MYSQL_PASSWORD: ward
    ports:
      - 0.0.0.0:3050:80
